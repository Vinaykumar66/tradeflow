name: tradeflow
description: Business Operations Platform - Phase 1
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0   # auth + database (NO storage - using R2)
  minio: ^3.0.0         # Cloudflare R2 / S3-compatible storage
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.3.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  razorpay_flutter: ^1.3.7
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  permission_handler: ^11.3.0
  pdf:      ^3.10.0
  printing: ^5.12.0   
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.4
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0   # temp directory to write the CSV before sharing
  barcode: ^2.2.7 # QR code widget, used by pw.BarcodeWidget in the PDF
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
flutter:
  uses-material-design: true
